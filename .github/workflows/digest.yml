# ============================================================================
#  SkillUp Daily Digest — GitHub Actions workflow
#  HARD DEADLINE: the email must arrive before ~9-10 AM Nepal time.
#  SIXTEEN morning slots (every 30 min, 2:30 AM -> 10:00 AM NPT) + 3 daytime
#  rescues. You read at 5:00 AM — the ladder starts at 2:30 AM NPT so even a
#  30-90 min scheduler delay still lands the email before you wake.
#  You can also trigger it manually: Actions tab -> Run workflow.
# ============================================================================

name: SkillUp Daily Digest

on:
  schedule:
    # DEADLINE LADDER — the digest MUST arrive before ~9-10 AM Nepal time.
    # A run starts every 30 minutes through the whole morning (2:30 AM ->
    # 10:00 AM NPT = 16 chances), then 3 daytime rescues as a last resort.
    # GitHub's free scheduler is "best effort": it delays slots 15-90 min and
    # sometimes skips one — but the next try is never more than 30 min away,
    # and skipping ALL SIXTEEN morning slots has never happened. (A literal
    # 5-minute cron would be delayed MORE, not less — GitHub de-prioritizes
    # the tightest schedules, so 30 min is the reliable sweet spot.)
    # main.py delivers only the FIRST digest of each Nepal day; every later
    # slot sees "already delivered today" and exits in ~13 s — zero cost,
    # zero duplicate emails. Each slot fires INDEPENDENTLY.
    #   16 morning slots (UTC -> NPT):      3 rescues:
    #   20:45 = 2:30 AM   00:15 = 6:00 AM   06:15 = 12:00 PM
    #   21:15 = 3:00 AM   00:45 = 6:30 AM   10:15 =  4:00 PM
    #   21:45 = 3:30 AM   01:15 = 7:00 AM   14:15 =  8:00 PM
    #   22:15 = 4:00 AM   01:45 = 7:30 AM
    #   22:45 = 4:30 AM   02:15 = 8:00 AM
    #   23:15 = 5:00 AM   02:45 = 8:30 AM
    #   23:45 = 5:30 AM   03:15 = 9:00 AM
    #                     03:45 = 9:30 AM   04:15 = 10:00 AM (deadline guard)
    # GitHub cron ONLY understands UTC. To change a time: UTC = NPT - 5:45.
    - cron: "45 20 * * *"   # 2:30 AM  ┐
    - cron: "15 21 * * *"   # 3:00 AM  │
    - cron: "45 21 * * *"   # 3:30 AM  │
    - cron: "15 22 * * *"   # 4:00 AM  │
    - cron: "45 22 * * *"   # 4:30 AM  │   MORNING LADDER
    - cron: "15 23 * * *"   # 5:00 AM  │   a try every 30 minutes
    - cron: "45 23 * * *"   # 5:30 AM  │   until the 10:00 AM deadline
    - cron: "15 0 * * *"    # 6:00 AM  │
    - cron: "45 0 * * *"    # 6:30 AM  │
    - cron: "15 1 * * *"    # 7:00 AM  │
    - cron: "45 1 * * *"    # 7:30 AM  │
    - cron: "15 2 * * *"    # 8:00 AM  │
    - cron: "45 2 * * *"    # 8:30 AM  │
    - cron: "15 3 * * *"    # 9:00 AM  │
    - cron: "45 3 * * *"    # 9:30 AM  │
    - cron: "15 4 * * *"    # 10:00 AM ┘ (deadline guard)
    - cron: "15 6 * * *"    # 12:00 PM — rescue 1
    - cron: "15 10 * * *"   #  4:00 PM — rescue 2
    - cron: "15 14 * * *"   #  8:00 PM — rescue 3 (absolute last chance)
  workflow_dispatch: {}   # adds the green "Run workflow" button for testing
  # --------------------------------------------------------------------------
  # EXTERNAL KICK (Plan B) — cron-job.org (free, punctual) POSTs to GitHub's
  # API every morning:  2:35, 4:35, 7:05 AM NPT  (event_type: digest-kick).
  # This starts the digest even when GitHub's own cron scheduler sleeps.
  # main.py applies the one-email-per-day guard to these kicks, so the
  # backup pings are harmless: the first success delivers, the rest exit
  # in seconds. The green "Run workflow" button still ALWAYS sends (tests).
  # --------------------------------------------------------------------------
  repository_dispatch:
    types: [digest-kick]

permissions:
  contents: write         # allows the bot to commit seen.json back

concurrency:
  group: skillup-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SkillUp Digest (fetch -> PDF -> email)
        env:
          # All credentials come from repo Secrets — nothing personal is
          # stored in this file. GitHub passes secrets you never created as
          # empty strings; main.py handles those safely (no crash, and the
          # run still produces the PDF locally without sending).
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || secrets.GMAIL_USER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
        run: python main.py

      # --------------------------------------------------------------------
      # Commits the dedup memory back so tomorrow's run never re-sends items.
      # ONLY on success: if the run failed (e.g. the email could not be
      # sent), seen.json stays uncommitted, so the next backup slot re-sends
      # the full digest instead of losing the day's news. The commit also
      # counts as repo activity, which prevents GitHub from auto-disabling
      # the schedule after 60 days of inactivity.
      # Fully guarded: never fails the job when there is nothing to commit.
      # --------------------------------------------------------------------
      - name: Commit seen.json (dedup memory + keeps repo active)
        if: success()
        continue-on-error: true   # a failed commit must NEVER show a red run:
        run: |                    # the email itself already went out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f seen.json ]; then
            echo "seen.json was not created this run — nothing to commit"
            exit 0
          fi
          git add seen.json
          if git diff --cached --quiet; then
            echo "seen.json unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: update seen.json [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
