# ============================================================================
#  SkillUp Daily Digest — GitHub Actions workflow
#  Build starts every day at 22:15 UTC = 4:00 AM Nepal Time (NPT, UTC+5:45),
#  so the email lands by ~5:00 AM NPT even when GitHub's free scheduler is
#  running late (15-60 min queues are normal under load).
#  You can also trigger it manually: Actions tab -> Run workflow.
# ============================================================================

name: SkillUp Daily Digest

on:
  schedule:
    # FOUR slots per night = a backup ladder, so a skipped or failed slot
    # can never cost you a day. main.py delivers only the FIRST digest of
    # each Nepal day; every later slot sees "already delivered today" and
    # exits in ~1 second (no duplicate email, no wasted fetching).
    #   22:15 UTC = 04:00 AM NPT  primary  (email lands by ~5:00 AM)
    #   23:45 UTC = 05:30 AM NPT  backup 1 (if the primary slot was skipped)
    #   01:45 UTC = 07:30 AM NPT  backup 2 (if both earlier slots failed)
    #   10:15 UTC = 04:00 PM NPT  same-day rescue (rare GitHub-wide outages)
    # GitHub cron ONLY understands UTC, is "best effort" (slots can be queued
    # 15-60 min or occasionally skipped), and fires each slot INDEPENDENTLY
    # of manual runs. To change delivery time: UTC = desired NPT time - 5:45.
    - cron: "15 22 * * *"
    - cron: "45 23 * * *"
    - cron: "45 1 * * *"
    - cron: "15 10 * * *"
  workflow_dispatch: {}   # adds the green "Run workflow" button for testing

permissions:
  contents: write         # allows the bot to commit seen.json back

concurrency:
  group: skillup-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SkillUp Digest (fetch -> PDF -> email)
        env:
          # The "|| 'default'" protects against secrets that were never
          # created (GitHub sends those as empty strings).
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'Kusalkandel0@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || secrets.GMAIL_USER || 'Kusalkandel0@gmail.com' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
        run: python main.py

      # --------------------------------------------------------------------
      # Commits the dedup memory back so tomorrow's run never re-sends items.
      # ONLY on success: if the run failed (e.g. the email could not be
      # sent), seen.json stays uncommitted, so the next backup slot re-sends
      # the full digest instead of losing the day's news. The commit also
      # counts as repo activity, which prevents GitHub from auto-disabling
      # the schedule after 60 days of inactivity.
      # Fully guarded: never fails the job when there is nothing to commit.
      # --------------------------------------------------------------------
      - name: Commit seen.json (dedup memory + keeps repo active)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f seen.json ]; then
            echo "seen.json was not created this run — nothing to commit"
            exit 0
          fi
          git add seen.json
          if git diff --cached --quiet; then
            echo "seen.json unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: update seen.json [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
