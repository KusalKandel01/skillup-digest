# ============================================================================
#  SkillUp Daily Digest — GitHub Actions workflow
#  Runs every day at 23:15 UTC = 5:00 AM Nepal Time (NPT, UTC+5:45).
#  You can also trigger it manually: Actions tab -> Run workflow.
# ============================================================================

name: SkillUp Daily Digest

on:
  schedule:
    # 23:15 UTC  ==  05:00 NPT (Nepal, UTC+5:45) the NEXT morning.
    # GitHub cron ONLY understands UTC. To change delivery time:
    #   UTC hour = desired NPT hour - 5:45  (e.g. 5:00 AM NPT -> 23:15 UTC)
    - cron: "15 23 * * *"
  workflow_dispatch: {}   # adds the green "Run workflow" button for testing

permissions:
  contents: write         # allows the bot to commit seen.json back

concurrency:
  group: skillup-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SkillUp Digest (fetch -> PDF -> email)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}     # optional: non-Gmail sender
          SMTP_PORT: ${{ secrets.SMTP_PORT }}     # optional: non-Gmail sender
        run: python main.py

      # --------------------------------------------------------------------
      # Commits the dedup memory back so tomorrow's run never re-sends items.
      # This commit also counts as repo activity, which prevents GitHub from
      # auto-disabling the schedule after 60 days of inactivity.
      # Fully guarded: never fails the job when there is nothing to commit.
      # --------------------------------------------------------------------
      - name: Commit seen.json (dedup memory + keeps repo active)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f seen.json ]; then
            echo "seen.json was not created this run — nothing to commit"
            exit 0
          fi
          git add seen.json
          if git diff --cached --quiet; then
            echo "seen.json unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: update seen.json [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
